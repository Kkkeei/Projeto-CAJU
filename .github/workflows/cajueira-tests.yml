name: Cajueira tests

on:
  push:
    paths:
      - "Cajueira/**"
      - ".github/workflows/cajueira-tests.yml"
  pull_request:
    paths:
      - "Cajueira/**"
      - ".github/workflows/cajueira-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: Cajueira
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m pytest -v
      - name: Compile source, tests and examples
        run: python -m compileall -q src tests examples
      - name: Run six examples
        run: |
          for example in examples/0*.py; do
            python "$example"
          done
